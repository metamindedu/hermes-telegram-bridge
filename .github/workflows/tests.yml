name: Bridge tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, core ${{ matrix.core.generation }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14']
        node: ['24']
        core:
          - generation: legacy
            ref: 74306c1d1b080837744faca3e371267dd09dda4b
          - generation: current
            ref: 297552a9d646119871391d202509822cd86330df
    runs-on: ${{ matrix.os }}
    env:
      # All Hermes homes and tempfile fixtures are disposable runner-owned data.
      HERMES_HOME: ${{ github.workspace }}/.ci-scratch/home
      HERMES_TEST_TMPDIR: ${{ github.workspace }}/.ci-scratch/scratch
      HERMES_CORE_GENERATION: ${{ matrix.core.generation }}
      HERMES_CORE_REF: ${{ matrix.core.ref }}
      # Dependencies are already synced from the immutable checkout below; do not
      # let the source-checkout auto-bootstrap rebuild or re-home this CI venv.
      HERMES_DISABLE_LAZY_INSTALLS: '1'
      HERMES_CORE_ROOT: ${{ github.workspace }}/hermes-agent
    steps:
      - name: Checkout bridge source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Exact old public pin supplies migration/rollback bytes, not a synthetic old factory.
          fetch-depth: 0

      - name: Checkout immutable Hermes core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.core.ref }}
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - name: Sync pinned Hermes core environment and test dependencies
        shell: bash
        working-directory: hermes-agent
        env:
          UV_PROJECT_ENVIRONMENT: .venv
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --no-default-groups --extra telegram
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CORE_PY="$(cygpath -m "$GITHUB_WORKSPACE")/hermes-agent/.venv/Scripts/python.exe"
            WORKSPACE="$(cygpath -m "$GITHUB_WORKSPACE")"
          else
            CORE_PY="$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python"
            WORKSPACE="$GITHUB_WORKSPACE"
          fi
          uv pip install --python "$CORE_PY" -r "$WORKSPACE/desktop-plugins/session-complete-telegram/requirements-test.txt"
          "$CORE_PY" -c "from pathlib import Path; import os; Path(os.environ['HERMES_HOME']).mkdir(parents=True, exist_ok=True); Path(os.environ['HERMES_TEST_TMPDIR']).mkdir(parents=True, exist_ok=True)"
          # Export tempfile roots only after creating them; checkout/setup steps
          # retain the runner's valid original temporary directories.
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$HERMES_TEST_TMPDIR" "$HERMES_TEST_TMPDIR" "$HERMES_TEST_TMPDIR" >> "$GITHUB_ENV"

      - name: Node syntax and behavior tests
        shell: bash
        working-directory: desktop-plugins/session-complete-telegram
        run: |
          node --check desktop/plugin.js
          node --test plugin.test.mjs reply.test.mjs followup.test.mjs approval.test.mjs materialization.test.mjs settings.test.mjs completion_recovery.test.mjs recovery_review.test.mjs helper_budget.test.mjs

      - name: Full Python bridge and native-install tests
        shell: bash
        working-directory: desktop-plugins/session-complete-telegram
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            CORE_PY="$(cygpath -m "$GITHUB_WORKSPACE")/hermes-agent/.venv/Scripts/python.exe"
          else
            CORE_PY="$GITHUB_WORKSPACE/hermes-agent/.venv/bin/python"
          fi
          "$CORE_PY" -m unittest test_notifier test_reply_bridge test_followup_bridge test_approval_bridge test_native_install test_registration test_feature_gates test_light_corrections test_final_boundaries test_settings_control test_review_revocation test_review_notification_boundaries test_producer_epoch test_completion_recovery test_recovery_review -v
