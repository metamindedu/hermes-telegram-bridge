name: session-complete-telegram
version: '1.8.0'
requires_hermes: '>=0.21.5'
description: Sends settled Desktop completion notices and optionally handles replies or one-time command approvals through your existing default-home Telegram setup.
config_schema:
  service_enabled:
    type: bool
    default: true
    description: 텔레그램 서비스를 켭니다. 공식 플러그인 로드 또는 해제 상태는 변경하지 않습니다.
  completion_notifications_enabled:
    type: bool
    default: true
    description: 완료 알림을 보내며, 완료 알림 후속 입력 기능의 상위 스위치입니다.
  attention_notifications_enabled:
    type: bool
    default: true
    description: 입력 대기 알림을 보내며, 질문 답변과 승인 기능의 상위 스위치입니다.
  clarify_replies_enabled:
    type: bool
    default: true
    description: 질문 답변 기능을 제한합니다. 기존 replies_enabled 동의가 켜져 있어야 합니다.
  completion_followups_enabled:
    type: bool
    default: true
    description: 완료 알림 후속 입력 기능을 제한합니다. 기존 replies_enabled 동의가 켜져 있어야 합니다.
  replies_enabled:
    type: bool
    default: false
    description: 기존 동의입니다. 질문 답변과 완료 알림 후속 입력을 모두 허용하는 데 필요합니다.
  approvals_enabled:
    type: bool
    default: false
    description: 허용 가능한 명령 승인에 한해 Allow Once와 Deny 버튼을 표시합니다. attention 알림도 켜져 있어야 합니다.
python_dependencies:
  - markdown-it-py==4.2.0
  - PyYAML==6.0.3
  - python-telegram-bot==22.8
